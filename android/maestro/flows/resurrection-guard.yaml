# Resurrection guard (PR#35): a highlight deleted from Resaltados must stay
# deleted after its book is reopened. LWW tombstone must hold.
# NEVER uses clearState - session and Room data persist across runs.
#
# Pinned seed fixture (device locale is Spanish):
#   BOOK      La Odisea
#   ROW       excerpt containing "postreros" (rebuilt device seed).
#             The marked row MUST be the newest highlight (updated_at DESC):
#             every delete path (card menu, reader simulate-tap) targets the
#             topmost card, and the marker must match exactly that row and
#             no other alive row.
appId: com.nexo
tags: [regression, sync]
---
- launchApp:
    clearState: false
- runFlow:
    file: ../lib/dismiss-dialogs-if-present.yaml
- waitForAnimationToEnd:
    timeout: 3000
# Nav-shell settle gate (cold-start race): see reader-menu-delete.yaml.
- extendedWaitUntil:
    visible:
      text: "Ajustes"
    timeout: 15000

# ── Fixture gate: the seeded highlight row must exist before we delete it.
#    extendedWaitUntil per design D5: cold-start list load may lag the
#    default assert window; poll up to 20s. ──────────────────────────────────
- runFlow:
    file: ../lib/nav-to-tab.yaml
    env:
      TAB: "Resaltados"
- extendedWaitUntil:
    visible:
      text: ".*postreros.*"
    timeout: 20000

# ── Delete via card menu (full-string matching scopes each tap) ────────────
- tapOn: "Más opciones"          # card overflow menu (content-desc)
- extendedWaitUntil:
    visible:
      text: "Eliminar resaltado"
    timeout: 10000
- tapOn: "Eliminar resaltado"    # dropdown item (exact text, not the icon)
- assertVisible: "Eliminar resaltado"  # AlertDialog title is up
- tapOn: "Eliminar"              # AlertDialog confirm button (exact text)

# ── Row removed immediately ────────────────────────────────────────────────
- assertNotVisible:
    text: ".*postreros.*"

# ── PR#35 guard: reopen the affected book, return, row must stay gone ──────
- runFlow:
    file: ../lib/nav-to-tab.yaml
    env:
      TAB: "Estantería"
- runFlow:
    file: ../lib/open-book.yaml
    env:
      BOOK_TITLE: "La Odisea"
- pressKey: Back
- runFlow:
    when:
      notVisible: "Resaltados"
    commands:
      # First Back may only dismiss reader chrome; press again to exit.
      - pressKey: Back
- runFlow:
    file: ../lib/nav-to-tab.yaml
    env:
      TAB: "Resaltados"

# ── Tombstone holds: no resurrection after reopen.
#    Poll not-visible for 15s so a late async resurrection (sync apply)
#    still flips this red instead of racing a premature green. ──────────────
- extendedWaitUntil:
    notVisible:
      text: ".*postreros.*"
    timeout: 15000
