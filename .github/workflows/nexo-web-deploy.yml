name: Nexo Web deploy

on:
  # Tag-only, deliberately in its own workflow. A `paths` allow-list attached to a
  # branch push would also be evaluated against the tag's changed files, and a
  # release tag whose commit happens to touch nothing under nexo-web/ would then
  # silently skip the deploy. `release-builds.yml` avoids the same trap by
  # declaring pure tag triggers, and this mirrors that.
  #
  # There is a SECOND reason the site rebuilds, and it is not a tag: the
  # `app-release` dispatch sent by `release-builds.yml` once an app release has
  # finished attaching its assets. The download section resolves the newest
  # release assets AT BUILD TIME (`nexo-web/src/lib/releases.ts`), so the
  # deployed page is frozen at the moment nexo-web was built — without the
  # dispatch a freshly published desktop/android release would stay invisible,
  # with the page still pointing at the previous version's installers, until
  # someone happened to cut another `nexo-web-v*` tag.
  push:
    tags:
      - 'nexo-web-v*'
  repository_dispatch:
    types: [app-release]

permissions:
  contents: read

concurrency:
  # Serialises deploys of the same thing. `${{ github.ref }}` alone is no longer
  # enough now that a `repository_dispatch` also triggers this workflow: on a
  # dispatch the ref is the default branch (`refs/heads/main`), not a tag, so a
  # bare ref key would label every dispatched build with the same branch-shaped
  # key — indistinguishable from a (not currently existing) branch deploy, and
  # blind to which app release asked for the rebuild. `github.event_name` plus
  # the payload tag keeps the two trigger families explicit; a pushed nexo-web
  # tag still gets its own key, so the two run as separate deploys rather than
  # queueing behind each other under an ambiguous one. `cancel-in-progress`
  # stays false: a cancelled deploy could leave the Worker on a half-published
  # build.
  group: nexo-web-deploy-${{ github.event_name }}-${{ github.event.client_payload.tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # nexo-web is not a member of the root Bun workspace: it carries its own
        # bun.lock, so install and build both run from nexo-web/.
        working-directory: nexo-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the root `packageManager` field (`bun@1.4.2`).
          bun-version: '1.4.2'

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-nexo-web-${{ hashFiles('nexo-web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-nexo-web-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build
        # The build resolves the newest release assets through the GitHub REST
        # API (`nexo-web/src/lib/releases.ts`). Without a token that request is
        # anonymous and capped at 60 requests/hour per IP — and GitHub runners
        # share IP ranges, so the cap is not this workflow's budget alone. The
        # token raises it to 5,000/hour and is what keeps the download section
        # from silently falling back to the plain releases link.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run build

      - name: Deploy
        # Notice-skip while the Cloudflare credentials are absent, matching the web
        # job in release-builds.yml: a missing secret must not fail a release, but it
        # must be loud about not having deployed. Once CLOUDFLARE_API_TOKEN and
        # CLOUDFLARE_ACCOUNT_ID are repository secrets, every nexo-web tag deploys
        # the static-assets Worker declared in nexo-web/wrangler.jsonc.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::notice::Skipping deploy: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured. Add them as repository secrets to deploy nexo-web on tag."
            exit 0
          fi
          bunx wrangler@4 deploy --config wrangler.jsonc
