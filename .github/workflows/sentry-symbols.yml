# Sentry debug-files upload for Rust crashes (spec C3).
#
# Uploads Tauri's Rust debug artifacts (from the `tauri build` bundle output)
# to the `nextpage-desktop` Sentry project under the org slug carried by the
# `SENTRY_ORG` repository secret (see the upload step) so stack traces resolve
# to source file:line.
#
# Token-gated: when `SENTRY_AUTH_TOKEN` is absent (local dev, fork PRs) the
# upload step is skipped with an `echo` so the workflow stays green. The
# release itself can still ship — symbolication is an additive improvement
# and is not on the critical path for app start.
name: Sentry debug-files

on:
  push:
    branches: [main]
    # Only the desktop Rust build produces the debug files this uploads, so the pattern
    # must not fire for every release tag: a bare `*-v*` would also match `android-v*`
    # and `web-v*`. `v*` is kept so the historical bare tag still matches.
    tags: ['v*', 'desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-rust-debug-files:
    name: Upload Rust debug files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch enough history for `git rev-parse --short=12 HEAD` to resolve
          # and for sentry-cli to associate the upload with the right commit.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable


      - name: Setup Bun
        # Tauri beforeBuildCommand runs `bun run build`; without this the
        # build fails with `sh: 1: bun: not found`.
        uses: oven-sh/setup-bun@v2
      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JS dependencies
        # tauri build runs `bun run build` (vite) as beforeBuildCommand.
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Install Linux system deps (Tauri)
        # glib-sys/webkit2gtk need system libraries that ubuntu-latest lacks.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libglib2.0-dev libsoup-3.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libjavascriptcoregtk-4.1-dev pkg-config

      - name: Install Tauri CLI
        working-directory: desktop
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install sentry-cli
        run: |
          curl -fsSL https://github.com/getsentry/sentry-cli/releases/latest/download/sentry-cli-Linux-x86_64 -o /usr/local/bin/sentry-cli
          chmod +x /usr/local/bin/sentry-cli
          sentry-cli --version

      - name: Build Tauri bundle (debug symbols)
        working-directory: desktop
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          cargo tauri build --debug
          # `cargo tauri build --debug` keeps debug info in the binary without
          # stripping; the resulting `.so` files land under `src-tauri/target/`
          # and the bundled `.deb`/`.AppImage`/`.dmg` are produced under
          # `src-tauri/target/release/bundle/`. We upload `.so`/`.dSYM`/`.pdb`
          # siblings so Rust traces deobfuscate across Linux/macOS/Windows.

      - name: Upload debug files (token-gated)
        working-directory: desktop
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # From the secret, not `vars.SENTRY_ORG`: no such repository variable
          # exists, so the `|| 'nextpage-android'` fallback this used to carry
          # resolved to a slug that is NOT this project's org — the upload would
          # have failed the moment a token made this step run (the same wrong
          # fallback app/build.gradle.kts used to have).
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: nextpage-desktop
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN is empty — skipping debug-files upload (local-green run)."
            exit 0
          fi

          set -euo pipefail
          # `target/*/debug` picks up the per-target debug subdirs produced by
          # Cargo (`target/debug`, `target/x86_64-unknown-linux-gnu/debug`, …).
          # `--include-sources` attaches a debuginfo payload that Sentry uses
          # to resolve Rust frame addresses back to file:line.
          sentry-cli debug-files upload \
            --org "${SENTRY_ORG}" \
            --project "${SENTRY_PROJECT}" \
            --include-sources \
            "target/*/debug"
