# Release notes — release-please driven release PR + GitHub release per component.
#
# Triggered on every push to `main` that touches a version-relevant path.
# release-please-action reads `release-please-config.json` + `.release-please-manifest.json`
# and opens (or updates) one release PR that bumps the payload files declared per package:
# `desktop/package.json`, `desktop/src-tauri/tauri.conf.json`, `desktop/src-tauri/Cargo.toml`,
# `android/app/build.gradle.kts:versionName`, `.release-please-manifest.json` and each
# package's `CHANGELOG.md`.
# On release-PR merge, a GitHub release is created per component.
#
# Known limitation: `desktop/src-tauri/Cargo.lock` is deliberately NOT an extra-file.
# release-please has no updater that can maintain it safely — `generic` is annotation-driven
# and a machine-generated lockfile has nowhere to put a hint, while `toml` re-serialises the
# whole document and strips its generated header comments. So the manifest stays one release
# ahead of the lock's entry for `nexo-desktop`; cargo corrects it on the next build and no
# workflow uses `--locked`, so nothing fails. Fixing it properly means moving the desktop
# package onto the crate itself (release-type: rust, component: desktop, changelog-path) so
# the lock is updated natively — deferred until that change can get its own validation cycle.
#
# Note the crate version is NOT cosmetic: `desktop/src-tauri/src/sentry_init.rs` uses
# `CARGO_PKG_VERSION` to build the Sentry release string (`nexo-desktop@{version}+{sha}`).
#
# Token-gated: `RELEASE_PLEASE_TOKEN` is a Personal Access Token, and it MUST be passed as
# the `token` INPUT. release-please-action only reads `inputs.token` (whose default is
# `github.token`); supplying it as an env var is inert. With the default token the release
# PR is authored by `github-actions[bot]`, GitHub does not start workflows for such PRs, so
# the required `Android checks` context never reports and the release PR stays BLOCKED.
name: Release Notes

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/**'
      - 'web/**'
      - '.github/workflows/release-notes.yml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - 'docs/devx/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

# Single concurrent run on `main` cancels in-flight reruns to avoid
# race-condition between two release-please passes opening conflicting PRs.
concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # release-please needs full history to walk commits since the last tag.
          fetch-depth: 0

      - name: Run release-please
        id: release-please
        # Pinned instead of `@v4`: that is a moving tag, and a silent release-please
        # upgrade is what changed the default tag naming (include-component-in-tag
        # flipped to false), collapsing desktop and android onto one `v0.2.0` tag and
        # leaving android without a release.
        uses: googleapis/release-please-action@v4.4.1
        with:
          # Must be the `token` INPUT, never an env var: the action only reads
          # `inputs.token`, whose default is `github.token`. With the default token the
          # release PR is authored by `github-actions[bot]`; GitHub does not start
          # workflows for those PRs, so the required `Android checks` context never
          # reports and the release PR stays permanently BLOCKED.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
