name: Web CI

on:
  pull_request:
    # No `branches` filter on purpose, same as `android-ci.yml`: chained PRs
    # target intermediate branches, not `main`, and a `branches: [main]`
    # filter silently skipped CI for every slice of a feature-branch-chain.
    # PRs to any base are safe to run.
    #
    # Positive `paths` instead of `paths-ignore` (see ci-trigger-hygiene): a
    # negative list re-triggered this suite whenever a PR touched any unlisted
    # path (bun.lock, README, docs/, scripts/, …) — the reported symptom of
    # android PRs running the web gate. The allow-list states exactly what web
    # depends on; everything else starts nothing.
    #
    # NOTE: an earlier version of this comment claimed branch protection
    # requires this check on `main` — verified via API, FALSE: protection
    # requires ONLY `Android checks`. Because this check is not required,
    # trigger-level `paths` is safe here. If it ever becomes required, move
    # the filter in-job like android-ci.yml or PRs it skips become BLOCKED.
    paths:
      - 'web/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      # The shared untranslated-string guard runs in this job: editing it must
      # re-prove the gate, otherwise a change to the rule ships unverified.
      - 'scripts/check-i18n.mjs'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'packages/**'
      # Same reason as desktop-ci: a dep bump merged to main must re-prove
      # the web gate against the actual merge result.
      - 'bun.lock'
      - 'package.json'
      - 'scripts/check-i18n.mjs'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

# Concurrency: cancel superseded runs on the same PR/branch so we don't
# burn runner time on stale pushes (matches the Desktop CI pattern).
concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 keeps the full git history, matching the other
          # workflows in this repo.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match the root `packageManager` field (`bun@1.4.2`).
          # Bump together with the `packageManager` field.
          bun-version: '1.4.2'

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        # Root workspace: a single bun.lock at the repo root serves desktop,
        # web, and packages/*; the install runs at the repo root.
        run: bun install --frozen-lockfile

      - name: Astro check
        run: bun run --cwd web check

      - name: Check formatting
        run: bun run --cwd web format:check

      - name: Check untranslated strings
        # scripts/check-i18n.mjs parses every .astro file with the Astro compiler
        # and fails on hardcoded user-visible strings; it also asserts the ES/EN
        # dictionaries expose the same non-empty key set.
        run: bun run --cwd web check:i18n

      - name: Web tests
        # Enforces the addons.json seed contract (src/data/addons.spec.ts) and
        # the ES/EN dictionary parity spec. `astro check` cannot see through the
        # `as unknown as AddonSeed[]` cast in addons.ts, so without this step a
        # malformed seed sails through CI.
        run: bun run --cwd web test

      - name: Astro build
        # `build` runs the `prebuild` emitter (scripts/emit-surfaces.mjs), so the
        # worktree ends up holding freshly generated machine surfaces.
        run: bun run --cwd web build

      - name: Check committed machine surfaces are current
        # web/public/{catalog.json,llms.txt,sitemap.xml,robots.txt} are generated
        # by the emitter and committed. A seed change that is not re-emitted
        # would publish a stale, lying surface, so this gate fails on real drift.
        #
        # It runs after `Astro build` (which re-ran the emitter), so the worktree
        # holds the freshly generated surfaces and the index holds the committed
        # ones; `git diff` compares the two.
        #
        # catalog.json embeds `generated-at: new Date().toISOString()`, so a bare
        # `git diff --exit-code` would fail on every run. `-I` drops a hunk only
        # when EVERY changed line matches the regex: the volatile timestamp line
        # is ignored, while a hunk that also carries a real change still fails.
        run: |
          git diff --exit-code --ignore-matching-lines='"generated-at"' -- \
            web/public/catalog.json \
            web/public/llms.txt \
            web/public/sitemap.xml \
            web/public/robots.txt

      - name: Validate manifests
        run: bun run --cwd packages/manifest-validator test
