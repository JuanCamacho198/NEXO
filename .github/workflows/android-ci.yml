name: Android CI

on:
  # Allow maintainers to re-run the full gate manually from the Actions tab.
  # The optional input additionally runs the macrobenchmark regression gate in
  # the `android-benchmark` job. It defaults to false because
  # `baseline/metrics-baseline.json` is still an S9 placeholder: the gate fails
  # by design until a device run establishes real numbers (see that job).
  workflow_dispatch:
    inputs:
      benchmark_regression_gate:
        description: 'Also run :benchmark:verifyBenchmarkRegression against baseline/metrics-baseline.json'
        type: boolean
        default: false
  # No `branches` filter on purpose: chained PRs target intermediate branches,
  # not `main`, and a `branches: [main]` filter silently skipped CI for every
  # slice of a feature-branch-chain. Branch protection only requires this check
  # on `main`, so running it on PRs to any base is safe.
  # No `paths-ignore` on this trigger, on purpose. Branch protection requires
  # the `Android checks` job on `main`; with a trigger-level path filter a
  # desktop/web/packages-only PR never started this workflow, so the required
  # check never reported and the PR stayed permanently BLOCKED. The path
  # filtering now lives inside the job (`Detect Android-relevant changes`): the
  # job always runs and always reports, while the heavy Android steps below run
  # only when Android-relevant paths actually changed.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'desktop/src-tauri/**'
      - 'supabase/**'
      - 'scripts/ci/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

# Concurrency: cancel superseded runs on the same PR/branch.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the CI emulator used by the device jobs below.
# Editing any of these must invalidate the AVD cache key on purpose: a cached
# AVD + snapshot is only valid for the system image it was created from.
env:
  EMULATOR_API_LEVEL: '34'
  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64
  EMULATOR_PROFILE: pixel_6
  EMULATOR_AVD_NAME: ci-emulator

jobs:
  android-checks:
    name: Android checks
    runs-on: ubuntu-latest
    # Full unit suite (~1117 tests) + detekt + verification gates. Locally the
    # full debug suite ran in ~5m12s on Windows; ubuntu runners are comparable
    # but a cold-cache first run is slower, so leave generous headroom.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 keeps history for release-mapping / version checks,
          # and lets the relevance check diff base..head by SHA below.
          fetch-depth: 0

      - name: Detect Android-relevant changes
        # This step exists so the `Android checks` job always RUNS on a pull
        # request and always REPORTS a conclusion, which is what branch
        # protection requires. The alternative — filtering paths on the
        # `pull_request` trigger — skipped the workflow entirely for
        # desktop-only PRs, so the required check never appeared and the PR was
        # unmergeable. A non-relevant PR now reports a fast, successful no-op
        # instead of paying for the full Android suite.
        #
        # The relevance set includes every root the G2 progress writer audit
        # scans (desktop/src-tauri, supabase, scripts/ci), not just android/:
        # otherwise a desktop- or migration-only writer regression would skip
        # the audit entirely.
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push/workflow_dispatch: never a required-check context, so always
            # do the real work.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" \
            | grep -qE '^(android/|desktop/src-tauri/|supabase/|scripts/ci/|\.github/workflows/android-ci\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No Android-relevant changes in this PR; reporting success as a no-op."
          fi

      - name: Setup Java (Temurin 17)
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: steps.changes.outputs.relevant == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          # Remote build cache + config cache reuse cut the cold JVM/config
          # tax; the gradle User Home cache makes dependency + Robolectric
          # jars survive between runs.
          cache-read-only: false
          add-job-summary: 'on-failure'

      - name: Make gradlew executable
        if: steps.changes.outputs.relevant == 'true'
        # No-op on the Linux runner, but defensive: if a contributor ever
        # commits gradlew without the executable bit, this step restores it
        # rather than failing the job with a confusing permission error.
        working-directory: android
        run: chmod +x ./gradlew || true

      - name: Progress single-writer audit (G2)
        # FR-10 / WU2a-WU2b gate: fails if any code path reintroduces an intentional
        # writer of the retired books.progress_percentage column. The DB-level
        # backfill invariant (== 0 unrepresentable positions) is asserted by the
        # 29->30 migration test in the unit suite below.
        if: steps.changes.outputs.relevant == 'true'
        run: bash scripts/ci/progress-single-writer-audit.sh

      - name: Progress audit self-test (fixtures must fail, tree must pass)
        # Proves the gate above can actually fail: every committed writer fixture
        # under scripts/ci/fixtures/progress-audit/ MUST be caught (audit exits
        # 1) and the real tree MUST pass (exit 0). Covers the two writer shapes
        # the line-based scan used to miss: a multi-line INSERT column list and a
        # setter-style mutation. Runs identically with or without ripgrep.
        if: steps.changes.outputs.relevant == 'true'
        run: bash scripts/ci/progress-single-writer-audit-selftest.sh

      - name: Run unit tests, detekt and verification gates
        if: steps.changes.outputs.relevant == 'true'
        working-directory: android
        # Linux runner: the daemon is fine (the --no-daemon prescription was
        # for the local Windows pwsh/Gradle VFS hang; an ephemeral runner just
        # pays a cold JVM start for nothing). Configuration cache + build
        # cache remove the remaining per-run reconfiguration/rebuild tax.
        #
        # Full unit suite (all ~1117 tests, no --tests filter). Instrumentation
        # tests are intentionally out of scope — no emulator job (deferred).
        # The verify* tasks below are the cheap, deterministic string/source
        # gates. verifyReleaseMapping and verifySentryMappingUpload are
        # release-only (R8 mapping / SENTRY_AUTH_TOKEN) and stay out of CI.
        run: |
          ./gradlew \
            --configuration-cache \
            --build-cache \
            -Dorg.gradle.vfs.watch=false \
            :app:testDebugUnitTest \
            detekt \
            spotlessCheck \
            :app:lintDebug \
            :app:verifyStringParity \
            :app:verifyAuthScreenNoHardcodedStrings \
            :app:verifyNoReaderUiStateResidue \
            :app:koverXmlReportDebug \
            :app:koverHtmlReportDebug

      - name: Upload Kover coverage reports
        # Report-only: coverage is published as an artifact and never gates the
        # test result (Kover's `verify` block is deliberately absent; a coverage
        # bound is deferred).
        #
        # `if-no-files-found: warn`, not `error`. The generation task runs in the
        # gate step above, so a genuinely missing report already fails THERE; if
        # the report is absent at upload time it is because an earlier gate
        # failed, and turning that into a second red step only buries the real
        # error under a confusing "No files were found" message.
        # The relevance guard matters: on a no-op PR no report exists at all, so
        # the upload is skipped instead of reporting a misleading result.
        # `if: always()` keeps the report available whenever it does exist, even
        # when an earlier gate failed.
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: kover-coverage
          path: |
            android/app/build/reports/kover/reportDebug.xml
            android/app/build/reports/kover/htmlDebug/
          if-no-files-found: warn

      - name: Print failed test reports
        if: failure() && steps.changes.outputs.relevant == 'true'
        working-directory: android
        # The Gradle console only shows the failing test name; the XML report
        # carries the expected/actual message needed to diagnose without SSH.
        run: |
          grep -rl "<failure\|<error" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | while read -r f; do
            echo "===== $f ====="
            grep -A5 '<failure\|<error' "$f" | head -40
          done

  # ── S10 (android-stack-modernization): instrumented tests on an emulator ────
  # Closes the device workstream deferred since S5: the instrumented suites
  # (BookContextMenuTriggerTest, LibraryScreenCoverImageTest, the Room migration
  # and nav-stack tests, …) had never been executed because no emulator job
  # existed. They run here unmodified — this job executes them, it does not
  # author them.
  #
  # Additive by design: this job does NOT produce the required `Android checks`
  # context. That context stays owned by the unchanged `android-checks` job
  # above, so branch protection on `main` is untouched.
  #
  # Cadence: manual dispatch, OR a pull request TARGETING `main`. Not every PR.
  #
  # Rationale (maintainer decision, 2026-09-15): a feature-branch-chain opens
  # one PR per slice, and running this job on each of them boots the emulator
  # 14+ times for the same linear content — wasted queue time, 14 extra
  # chances of emulator flake, and real energy. The chain's tip carries the
  # accumulated tree, so instrumenting the PR that actually targets `main`
  # covers the same code with ONE run.
  #
  # The single condition also covers the push-to-`main` case: `github.base_ref`
  # is only populated for `pull_request` events, so on a `push` this evaluates
  # false and the merge commit does not re-boot the emulator the PR just ran.
  #
  # The macrobenchmark journeys are NOT here: four classes x five iterations,
  # each restarting the app, is far too slow for every PR. They live in
  # `android-benchmark`, which runs on dispatch only.
  android-emulator:
    name: Android instrumentation (emulator)
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    # ── Resident-memory budget (7 GB runner) ─────────────────────────────────
    # Run 41117195119 died in `:app:processDebugAndroidTestResources` with
    # `OutOfMemoryError thrown from the UncaughtExceptionHandler in thread
    # "main"` BEFORE any test ran. The cause was arithmetic, not a bug: the
    # runner has 7 GB, but the emulator (booted first and resident for the
    # whole Gradle phase) plus the daemons summed to ~9.5 GB:
    #
    #   emulator (its own default 2560 MB, no `-memory` was set)
    # + Gradle daemon 4096 MB + metaspace 768 MB
    # + Kotlin daemon 2048 MB
    # = ~9.5 GB  →  ~2.5 GB overshoot.
    #
    # These caps are CI-ONLY on purpose. `android/gradle.properties` is shared
    # with local Windows builds on a 7.3 GB machine where the current values
    # work and were tuned against a documented daemon-hang (see
    # `android/AGENTS.md` § "Gradle Daemon & Verify Hang"): lowering them in
    # the shared file would change local behaviour that is currently green.
    # An env override here keeps local byte-identical.
    #
    # New resident total: emulator 2048 + Gradle 2560 + metaspace 768
    # + Kotlin 1024 = ~6.4 GB, leaving ~0.6 GB for the OS, adb, the JVM
    # non-heap and native allocations.
    env:
      # `GRADLE_OPTS`/`JAVA_OPTS` are read by the wrapper before Gradle's own
      # fork, and `-D` here wins over `org.gradle.jvmargs` for the daemon the
      # wrapper starts. Metaspace stays at the shared 768m: the documented
      # hang was a METASPACE exhaustion, so 768m is the floor this job must
      # keep, not a value to trim.
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m
      # Kotlin runs out-of-process (`kotlin.compiler.execution.strategy=daemon`);
      # 1024m is enough for this module's androidTest source set, which only
      # adds testing libs on top of `main`.
      JAVA_OPTS: -Dkotlin.daemon.jvmargs=-Xmx1024m
      # `HeapDumpOnOutOfMemoryError` (set in `android/gradle.properties`) is
      # deliberately NOT carried into this override. A multi-GB `.hprof` on a
      # runner with limited free disk turns a clean OOM into a disk-full
      # cascade, and the dump is unusable without SSH access to the runner.
      # With the daemon capped at 2560m the dump could not exceed that, so the
      # diagnostic value is low and the disk cost is pure downside. It stays
      # enabled for local runs via the shared file.
    # Dedicated budget — never the 30m `Android checks` timeout, so a long
    # device run cannot eat the gate job's allowance (they are separate jobs
    # with separate budgets). Cold path: system-image install ~3–6m (the AVD
    # cache covers the AVD, not the ~1.5 GB system image) + AVD create /
    # snapshot / boot ~2–5m + Gradle debug + androidTest APK build ~6–10m +
    # install and 7 instrumented classes incl. Room migration tests ~4–8m
    # ≈ 16–31m worst case. 45m is ~1.5x that worst cold estimate and ~3x a warm
    # snapshot-cache run.
    timeout-minutes: 45
    steps:
      - name: Checkout
        # Default shallow history: `fetch-depth: 0` is only needed by the
        # release-mapping / version checks in `android-checks`. This job needs
        # the current tree and nothing else.
        uses: actions/checkout@v7

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          add-job-summary: 'on-failure'

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew || true

      - name: Provide test-shaped configuration
        # Instrumentation boots MainActivity, whose Hilt graph builds the Supabase
        # client: `SupabaseClientProvider.createClient()` hard-requires a non-blank
        # SUPABASE_URL/SUPABASE_ANON_KEY and throws otherwise, crashing the process
        # before any test runs. CI has no local.properties (gitignored), so those
        # BuildConfig fields are empty.
        #
        # These are TEST-SHAPED PLACEHOLDERS, not credentials. The repository is
        # public and a deep-link test only needs a value that satisfies
        # `isNotBlank()` plus supabase-kt's URL shape check — it never talks to a
        # live project. supabase-kt 3.5.0 does NOT parse or validate the key
        # (`SupabaseClientBuilder` only null-checks it; `decodeJwt` runs on
        # server-issued tokens, not the configured key), so a short
        # `sb_publishable_`-style string is sufficient and is the modern key shape.
        #
        # The URL must be a bare project origin: `SupabaseClientBuilder` throws on
        # URLs embedding a module path (`/auth/v1`, `/rest/v1`, `/storage/v1`,
        # `/realtime/v1`), which is why the `/auth/v1/callback` form is wrong here.
        #
        # All FIVE remaining config keys are written explicitly, even though every
        # one is optional at runtime. An absent key and an empty key are different
        # failures: absent, the Gradle `localProperties.getProperty(...) ?: ""`
        # default makes the key empty and *looks* identical, so a later reader
        # cannot tell "deliberately disabled here" from "forgotten". Writing them
        # makes the job's configuration complete and self-describing.
        #
        # Why each is safe as a placeholder:
        # - GOOGLE_BOOKS_KEY: blank omits the Books provider from the DI list
        #   (fail-closed); the app stays on Open Library + Gutenberg.
        # - SENTRY_DSN: blank makes `SentryAndroid.init` a no-op (NexoApplication).
        # - google.oauth.client.id / google.oauth.android.client.id: only feed
        #   BuildConfig + the `driveRedirectScheme` manifest placeholder. No
        #   instrumented test exercises Google sign-in or the Drive PKCE flow.
        # - update.feed.url: blank disables the app-update self-check (version
        #   display only), so no test can hang on a dead update feed.
        #
        # Scoped to this job ONLY. `android-checks` passes today without it (the JVM
        # suite never touches the Supabase client), and the benchmark /
        # baseline-profile jobs measure performance and never assert on auth state.
        working-directory: android
        run: |
          cat > local.properties <<'EOF'
          SUPABASE_URL=https://ci-test-project.supabase.co
          SUPABASE_ANON_KEY=sb_publishable_ci_test_placeholder_key_000000000000
          GOOGLE_BOOKS_KEY=
          SENTRY_DSN=
          google.oauth.client.id=
          google.oauth.android.client.id=
          update.feed.url=
          EOF

      - name: Enable KVM group perms
        # GitHub-hosted Ubuntu runners expose /dev/kvm, but the default
        # permissions do not let the runner user open it. Without KVM the
        # x86_64 emulator falls back to full emulation and the job is unusable.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        # A booted-once AVD snapshot turns a ~2–5m cold boot into ~30–90s. The
        # key encodes every emulator shape input, so changing any of them (or
        # the API level) builds a fresh snapshot instead of reusing one from a
        # different system image.
        #
        # ONLY the AVD dir is cached. `~/.android/adb*` used to be cached too and
        # that is what broke this job: those files are the runner's adb keypair,
        # and every GitHub runner generates its own. Restoring a foreign keypair
        # leaves adb unable to authenticate the freshly booted emulator, so
        # `getprop sys.boot_completed` loops on `adb: device offline` until the
        # timeout — and the stale snapshot then fails to load as well
        # (`Failed to load snapshot 'default_boot'`). Emulator-runner's own
        # guidance is to cache the AVD dir and let adb keys regenerate.
        # `-ram2048` is part of the key because `ram-size` writes `hw.ramSize`
        # into the AVD's `config.ini`: a snapshot taken from a 2560 MB AVD is a
        # different artifact from one taken at 2048 MB and restoring the wrong
        # one is the `Failed to load snapshot` class of failure this comment
        # already documents. Changing the key costs ONE cold path (~3–6m system
        # image install, which is not cached either way, + ~2–5m boot) on the
        # first run after this change; every run after that re-caches under the
        # new key and keeps the ~30–90s warm boot.
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: ~/.android/avd/*
          key: avd-${{ runner.os }}-api${{ env.EMULATOR_API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-${{ env.EMULATOR_PROFILE }}-ram2048

      - name: Create AVD and generate a snapshot for caching
        # Cache miss only: boot the AVD once and persist a clean snapshot. No
        # `-no-snapshot` here on purpose — that is what lets the snapshot be
        # written. Animations stay enabled for this throwaway boot; they are
        # disabled for the test run below, not for the snapshot that seeds it.
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          avd-name: ${{ env.EMULATOR_AVD_NAME }}
          force-avd-creation: false
          # `ram-size` (not a raw `-memory` flag) is the action's supported input
          # for AVD RAM: it writes `hw.ramSize` into `config.ini` at creation
          # time, so the snapshot is created for a 2048 MB AVD. Must match the
          # test run below. The emulator's own default is 2560 MB, which alone
          # was a third of the 7 GB runner and is what tipped the resident total
          # over the edge in run 41117195119. Do NOT go below 2048 — an
          # under-provisioned AVD OOM-kills the app under test and surfaces as
          # bogus test failures.
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests on the emulator
        # `-no-snapshot-save` loads the cached snapshot read-only: a test run
        # must never mutate the artifact the next run boots from.
        # `disable-animations: true` is required for the Compose UI assertions
        # (the app sets no `testOptions.animationsDisabled`).
        # `ram-size: 2048M` must match the snapshot-creation step above: it sets
        # `hw.ramSize` in the AVD's `config.ini`, so the booted emulator is the
        # same 2048 MB shape the snapshot was taken from. The emulator default of
        # 2560 MB is what OOMed this job.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          avd-name: ${{ env.EMULATOR_AVD_NAME }}
          force-avd-creation: false
          ram-size: 2048M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          # The action hands `script` to `sh -c`, so line continuations with a
          # trailing backslash are NOT interpreted: the `\` was passed to
          # Gradle as a task name and the job died with `Task '\' not found`
          # in ~54s without ever running a test. Keep this on ONE line.
          #
          # `--max-workers=2` caps Gradle's parallel workers (the file still
          # sets `org.gradle.parallel=true`). The runner has 4 cores, the
          # emulator wants its own, and `kspDebugKotlin` / `mergeExtDexDebug` /
          # `mergeExtDexDebugAndroidTest` each run twice here (app APK, then
          # test APK). Fewer concurrent workers lowers the peak that OOMed.
          #
          # `--configuration-cache` is deliberately omitted here: connected
          # device tasks are not reliably config-cache compatible, and a cache
          # failure would masquerade as a test failure.
          script: ./gradlew --build-cache --max-workers=2 -Dorg.gradle.vfs.watch=false :app:connectedDebugAndroidTest

      - name: Print failed instrumentation reports
        if: failure()
        working-directory: android
        # Same rationale as the gate job: the XML carries the expected/actual
        # message, which the Gradle console does not print.
        run: |
          find app/build/outputs/androidTest-results -name '*.xml' -print0 2>/dev/null \
            | xargs -0 -r grep -l '<failure\|<error' 2>/dev/null \
            | while read -r f; do
                echo "===== $f ====="
                grep -A8 '<failure\|<error' "$f" | head -60
              done

      - name: Upload instrumentation test reports
        # Diagnostic, not a gate: a boot failure means there are no reports at
        # all, and a second red step would only obscure the real failure.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-instrumentation-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn

  # ── S10: macrobenchmark journeys (workflow_dispatch only) ──────────────────
  # Four journey classes x five measured iterations, each restarting the app
  # under a fresh compilation mode — far too slow to wire into every PR, so it
  # is manually dispatched:
  #   * S11 generates the baseline profile from a SEPARATE dispatch-only job
  #     (`android-baseline-profile` below) so a profile run and a metrics run
  #     stay separately attributable; this job owns only the metrics artifact.
  #   * The checked-in regression baseline (`baseline/metrics-baseline.json`) is
  #     established FROM a run of this job: S9 shipped a PLACEHOLDER, and
  #     `:benchmark:verifyBenchmarkRegression` fails loudly while it is one (a
  #     green result against fabricated numbers would be a lie). The gate is
  #     therefore opt-in via the `benchmark_regression_gate` dispatch input
  #     rather than a step that is guaranteed red on every dispatch.
  android-benchmark:
    name: Android macrobenchmarks (dispatch only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Cold emulator boot (no snapshot, see below) + a full `:app:benchmark`
    # variant build + the benchmark test APK + the journeys: 4 classes x 5
    # iterations, cold/warm starts with navigation each iteration ≈ 20–28m cold.
    # 60m leaves >2x headroom and, like the emulator job, never touches the
    # 30m `Android checks` budget.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          add-job-summary: 'on-failure'

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew || true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run macrobenchmark journeys on the emulator
        # Deliberately NO AVD snapshot cache here: a restored snapshot carries
        # process/disk state from a previous run, which would skew cold-start
        # and frame timings. Benchmark measurements need a boot that is the same
        # every time, so this job always cold-boots (`-no-snapshot`) and pays for
        # it — it is a dispatch-only job, not a per-PR one.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          avd-name: ${{ env.EMULATOR_AVD_NAME }}
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          # ONE line for the same reason as the emulator job: the action hands
          # this to `sh -c`, so a trailing-backslash continuation becomes a
          # task named `\` and the run dies before executing anything.
          script: ./gradlew --build-cache -Dorg.gradle.vfs.watch=false :benchmark:connectedBenchmarkAndroidTest

      - name: Verify benchmark regression against the checked-in baseline
        # Opt-in: only meaningful once a run has turned
        # `baseline/metrics-baseline.json` from a placeholder into real numbers.
        if: ${{ inputs.benchmark_regression_gate }}
        working-directory: android
        run: |
          ./gradlew \
            --configuration-cache \
            --build-cache \
            -Dorg.gradle.vfs.watch=false \
            :benchmark:verifyBenchmarkRegression

      - name: Upload benchmark metrics
        # The emitted `metrics-current.json` IS this job's deliverable: it is
        # what S11 (and the baseline) consume, so a silently missing document is
        # a red step, not a warning.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-metrics
          path: |
            android/benchmark/build/outputs/benchmarkMetrics/
            android/benchmark/build/outputs/connected_android_test_additional_output/
          if-no-files-found: error

  # ── S11: baseline profile generation (workflow_dispatch only) ──────────────
  # The ONLY route that produces a real generated profile. `:app` applies the
  # `androidx.baselineprofile` consumer plugin with
  # `automaticGenerationDuringBuild = false`, so this job is the sole caller of
  # `:app:generateReleaseBaselineProfile`; it drives the :benchmark module's
  # BaselineProfileGenerator (cold start, Library scroll, Discover fling, Reader
  # open) and merges the collected rules back into :app.
  #
  # Dispatch-only, never on the PR path: collection needs a booted, unprofiled
  # device and re-installs the app under test many times. The per-PR
  # `android-checks` and `android-emulator` jobs are untouched.
  #
  # Deliberately a SEPARATE job from `android-benchmark` rather than an extra step
  # in it: this job's deliverable is the profile, that job's is the metrics JSON,
  # and one red step should name one broken thing.
  android-baseline-profile:
    name: Android baseline profile (dispatch only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Cold emulator boot (no snapshot — see below) + the `:app` profile-generation
    # variant + the producer test APK + 4 collection journeys (each iterating until
    # the profile stabilizes, capped by the library default). Measured macrobenchmark
    # journeys on the same emulator shape run 20–28m, so 60m keeps >2x headroom and,
    # like the other device jobs, never touches the 30m `Android checks` budget.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          add-job-summary: 'on-failure'

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew || true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate the baseline profile on the emulator
        # NO AVD snapshot cache: a restored snapshot ships a dirty, partly-warmed
        # profile on disk, and this task's entire output IS the profile. A cold boot
        # is the only state where "collected from a fresh install" is true.
        #
        # NOTE: the generation run must NOT pass `-PreleaseMinify=false`. The
        # profile is collected from the app variant the plugin pairs with the
        # shipped one; collecting from a non-minified build would yield rules the
        # shipped (minified) release cannot match.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          avd-name: ${{ env.EMULATOR_AVD_NAME }}
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          # ONE line: the action hands this to `sh -c`, so backslash line
          # continuations are not interpreted and become a task named `\`.
          # `--configuration-cache` is omitted for the same reason as the other
          # device jobs — the generation task drives connected instrumentation.
          script: ./gradlew --build-cache -Dorg.gradle.vfs.watch=false :app:generateReleaseBaselineProfile

      - name: Upload the generated baseline profile
        # THE deliverable: a maintainer commits the uploaded
        # `baseline-prof.txt` over `android/app/src/main/baseline-prof.txt` (the S8
        # AGP-consumed path). The glob is intentionally broad — the exact output
        # directory is chosen by the plugin (`saveInSrc`, `mergeIntoMain`), and a
        # silently missing profile is a red step, not a warning.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: baseline-profile
          path: |
            android/app/src/**/generated/baselineProfiles/**
            android/app/build/**/baselineProfiles/**
          if-no-files-found: error
