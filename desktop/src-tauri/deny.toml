[graph]
targets = [
    #"x86_64-unknown-linux-musl",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# These are transitive dependencies from Tauri (gtk-rs, unic, proc-macro-error)
# that are unmaintained but unavoidable since Tauri depends on them.
# We track these and will resolve them when Tauri updates.
ignore = [
    # All unmaintained advisories are transitive deps via Tauri/gtk-rs.
    # Linux-specific GTK3 bindings not used on Windows; will resolve when Tauri updates.
    "RUSTSEC-2024-0420", "RUSTSEC-2024-0370", "RUSTSEC-2025-0057",
    "RUSTSEC-2025-0075", "RUSTSEC-2025-0080", "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098", "RUSTSEC-2025-0100",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LicenseRef-UFL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.8
exceptions = [
    # epub declares the deprecated SPDX id `GPL-3.0`; the clarification below
    # normalizes it to `GPL-3.0-only` (the modern identifier for the same terms).
    { allow = ["GPL-3.0-only"], crate = "epub" },
]

# epub 2.1.5 ships a full GPL-3.0 LICENSE.txt but declares `license = "GPL-3.0"`,
# a deprecated SPDX identifier that cargo-deny flags with `warning[parse-error]`.
# Override it with the equivalent modern identifier, anchored to the crate's own
# license text so the override is validated on every check.
[[licenses.clarify]]
crate = "epub"
expression = "GPL-3.0-only"
license-files = [
    { path = "LICENSE.txt", hash = 0xe497def1 }
]

#[licenses.clarify]
#crate = "ring"
#expression = "MIT AND ISC AND OpenSSL"
#license-files = [
#    { path = "LICENSE", hash = 0xbd0eed23 }
#]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
