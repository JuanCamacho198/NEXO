[package]
name = "nexo-desktop"
version = "0.5.0"
description = "Nexo desktop shell"
authors = ["juancho998"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde", "clock"] }
regex = "1.13.1"
rusqlite = { version = "0.32.1", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentry = { version = "0.49", default-features = false, features = ["panic", "rustls"] }
# SECURITY DEBT: `devtools` exposes the webview inspector in release builds.
# Anyone with local access can read the live Supabase session from the webview.
# Acceptable while NEXO is pre-release; before public distribution gate the
# entry point (or drop the feature) — one-line change.
tauri = { version = "2.11.5", features = ["protocol-asset", "devtools"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = "2.4"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
thiserror = "1.0.69"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
epub = "2.1"
lopdf = "0.44.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
futures-util = { version = "0.3", default-features = false }
url = "2"
unicode-normalization = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.10"
